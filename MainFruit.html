<!DOCTYPE html>

<html lang="en">

<head>

  <base href="https://cdn.jsdelivr.net/gh/genizy/UGS-Assets@main/fruit%20ninja/">

  <meta charset="UTF-8" />

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <meta http-equiv="X-UA-Compatible" content="ie=edge" />

  <meta name="theme-color" content="#000000" />

  <title>Fruit Ninja</title>

  <!-- FIREBASE -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- ORIGINAL GAME STYLE -->

  <style>

    @font-face {
      font-family: gangofchinese;
      src: url('assets/font/gangofchinese.ttf');
    }

    html,
    body {
      height: 100%;
      width: 100% !important;
      margin: 0;
      background-color: #000000 !important;
      overflow: hidden;
    }

    .fontLoader {
      position: absolute;
      left: -1000px;
      visibility: hidden;
    }

    #phaser-canvas {
      margin: 0 auto;
      background-color: #000000;
    }

    body,
    #content {
      height: 100vh !important;
      max-height: 100vh !important;
    }

    #divAds,
    #tempads {
      display: none;
    }

    #enable3d-three-canvas,
    #enable3d-phaser-canvas {
      min-width: 100%;
      max-width: 100%;
      max-width: -webkit-fill-available;
      max-width: -moz-available;
      max-width: fill-available;
      margin: 0 auto;
    }

    @media (min-aspect-ratio: 1.85) {

      #enable3d-three-canvas,
      #enable3d-phaser-canvas {
        width: 960px;
        min-width: 640px;
      }
    }

    @media (min-aspect-ratio: 8/4) {

      #enable3d-three-canvas,
      #enable3d-phaser-canvas {
        min-width: 640px;
      }
    }

    /* SAVE POPUP */

    #savePopup {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      z-index: 999999;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      border: 2px solid #ffffff33;
    }

    #savePopup.show {
      opacity: 1;
    }

  </style>

</head>

<body>

  <!-- FONT PRELOAD -->

  <div class="fontLoader" style="font-family: gangofchinese;">-</div>
  <div class="fontLoader" style="font-family: gangofchinese;">-</div>

  <!-- GAME -->

  <div id="content">
    <div id="phaser-canvas"></div>
  </div>

  <!-- SAVE POPUP -->

  <div id="savePopup">Saving...</div>

  <script>

    // =========================================
    // FIREBASE CONFIG
    // =========================================

    const firebaseConfig = {
      apiKey: "AIzaSyDk4pnauEoa26zIglXPYLrPmQANn99BPss",
      authDomain: "fruitninja-428a7.firebaseapp.com",
      projectId: "fruitninja-428a7",
      storageBucket: "fruitninja-428a7.firebasestorage.app",
      messagingSenderId: "511253452386",
      appId: "1:511253452386:web:91879b4131ba9ede21233b"
    };

    // =========================================
    // INIT FIREBASE
    // =========================================

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();

    // =========================================
    // USER ID
    // =========================================

    let userId = localStorage.getItem(
      "fruitNinjaUserId"
    );

    if (!userId) {

      userId = crypto.randomUUID();

      localStorage.setItem(
        "fruitNinjaUserId",
        userId
      );
    }

    console.log("User ID:", userId);

    // =========================================
    // SAVE POPUP
    // =========================================

    function showSavePopup() {

      const popup =
        document.getElementById("savePopup");

      popup.classList.add("show");

      setTimeout(() => {

        popup.classList.remove("show");

      }, 1500);
    }

    // =========================================
    // PLAYER DATA
    // =========================================

    window.playerData = {
      bestScore: 0
    };

    window.currentScore = 0;

    // =========================================
    // LOAD SAVE
    // =========================================

    async function loadSave() {

      try {

        const doc = await db
          .collection("saves")
          .doc(userId)
          .get();

        if (doc.exists) {

          window.playerData =
            doc.data();

          console.log(
            "Save Loaded:",
            window.playerData
          );

        } else {

          console.log(
            "Creating New Save"
          );

          await saveGame();
        }

      } catch (e) {

        console.error(
          "Load failed:",
          e
        );

        const backup =
          localStorage.getItem(
            "fruitNinjaBackup"
          );

        if (backup) {

          window.playerData =
            JSON.parse(backup);

          console.log(
            "Loaded local backup"
          );
        }
      }
    }

    // =========================================
    // UPDATE BEST SCORE
    // =========================================

    function updateBestScore() {

      if (
        window.currentScore >
        window.playerData.bestScore
      ) {

        window.playerData.bestScore =
          window.currentScore;

        console.log(
          "New Best Score:",
          window.playerData.bestScore
        );
      }
    }

    // =========================================
    // SAVE GAME
    // =========================================

    async function saveGame() {

      try {

        updateBestScore();

        await db
          .collection("saves")
          .doc(userId)
          .set(window.playerData);

        localStorage.setItem(
          "fruitNinjaBackup",
          JSON.stringify(
            window.playerData
          )
        );

        console.log(
          "Game Saved"
        );

        showSavePopup();

      } catch (e) {

        console.error(
          "Save failed:",
          e
        );

        localStorage.setItem(
          "fruitNinjaBackup",
          JSON.stringify(
            window.playerData
          )
        );
      }
    }

    // =========================================
    // SCORE FUNCTION
    // =========================================

    window.setScore = function(score) {

      window.currentScore = score;

      if (
        score >
        window.playerData.bestScore
      ) {

        window.playerData.bestScore =
          score;

        saveGame();
      }
    };

    // =========================================
    // AUTO SAVE
    // =========================================

    setInterval(() => {

      saveGame();

    }, 10000);

    // =========================================
    // SAVE ON EXIT
    // =========================================

    window.addEventListener(
      "beforeunload",
      () => {

        saveGame();

      }
    );

    // =========================================
    // LOAD SAVE
    // =========================================

    loadSave();

    console.log(
      "Save system loaded successfully"
    );

  </script>

  <!-- ORIGINAL GAME FILES -->

  <script type="text/javascript" src="vendors.bundle.js"></script>

  <script type="text/javascript" src="main.bundle.js"></script>

</body>

</html>
