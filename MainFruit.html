<!DOCTYPE html>

<html lang="en">

<head>

  <base href="https://cdn.jsdelivr.net/gh/genizy/UGS-Assets@main/fruit%20ninja/">

  <meta charset="UTF-8" />

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <meta http-equiv="X-UA-Compatible" content="ie=edge" />

  <title>Fruit Ninja</title>

  <!-- FIREBASE -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>

    html,
    body {
      height: 100%;
      width: 100%;
      margin: 0;
      background: black;
      overflow: hidden;
    }

    #content {
      height: 100vh;
      width: 100vw;
    }

    #phaser-canvas {
      width: 100%;
      height: 100%;
    }

    /* SAVE POPUP */

    #savePopup {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      z-index: 999999;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      border: 2px solid #ffffff33;
    }

    #savePopup.show {
      opacity: 1;
    }

  </style>

</head>

<body>

  <div id="content">
    <div id="phaser-canvas"></div>
  </div>

  <!-- SAVE POPUP -->

  <div id="savePopup">Saving...</div>

  <script>

    // =========================================
    // FIREBASE CONFIG
    // =========================================

    const firebaseConfig = {
      apiKey: "AIzaSyDk4pnauEoa26zIglXPYLrPmQANn99BPss",
      authDomain: "fruitninja-428a7.firebaseapp.com",
      projectId: "fruitninja-428a7",
      storageBucket: "fruitninja-428a7.firebasestorage.app",
      messagingSenderId: "511253452386",
      appId: "1:511253452386:web:91879b4131ba9ede21233b"
    };

    // =========================================
    // INITIALIZE FIREBASE
    // =========================================

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();

    // =========================================
    // CREATE USER ID
    // =========================================

    let userId = localStorage.getItem("fruitNinjaUserId");

    if (!userId) {

      userId = crypto.randomUUID();

      localStorage.setItem(
        "fruitNinjaUserId",
        userId
      );
    }

    console.log("User ID:", userId);

    // =========================================
    // SAVE POPUP
    // =========================================

    function showSavePopup() {

      const popup =
        document.getElementById("savePopup");

      popup.classList.add("show");

      setTimeout(() => {

        popup.classList.remove("show");

      }, 1500);
    }

    // =========================================
    // PLAYER DATA
    // =========================================

    window.playerData = {
      bestScore: 0
    };

    window.currentScore = 0;

    // =========================================
    // LOAD SAVE
    // =========================================

    async function loadSave() {

      try {

        const doc = await db
          .collection("saves")
          .doc(userId)
          .get();

        if (doc.exists) {

          window.playerData = doc.data();

          console.log(
            "Save Loaded:",
            window.playerData
          );

        } else {

          console.log(
            "No save found. Creating new save."
          );

          await saveGame();
        }

      } catch (e) {

        console.error(
          "Firebase load failed:",
          e
        );

        // BACKUP LOCAL SAVE

        const backup =
          localStorage.getItem(
            "fruitNinjaBackup"
          );

        if (backup) {

          window.playerData =
            JSON.parse(backup);

          console.log(
            "Loaded local backup save"
          );
        }
      }
    }

    // =========================================
    // UPDATE BEST SCORE
    // =========================================

    function updateBestScore() {

      if (
        window.currentScore >
        window.playerData.bestScore
      ) {

        window.playerData.bestScore =
          window.currentScore;

        console.log(
          "New Best Score:",
          window.playerData.bestScore
        );
      }
    }

    // =========================================
    // SAVE GAME
    // =========================================

    async function saveGame() {

      try {

        updateBestScore();

        await db
          .collection("saves")
          .doc(userId)
          .set(window.playerData);

        localStorage.setItem(
          "fruitNinjaBackup",
          JSON.stringify(window.playerData)
        );

        console.log(
          "Game Saved Successfully"
        );

        showSavePopup();

      } catch (e) {

        console.error(
          "Save failed:",
          e
        );

        // SAVE LOCAL BACKUP

        localStorage.setItem(
          "fruitNinjaBackup",
          JSON.stringify(window.playerData)
        );
      }
    }

    // =========================================
    // SET SCORE
    // =========================================

    window.setScore = function(score) {

      window.currentScore = score;

      if (
        score >
        window.playerData.bestScore
      ) {

        window.playerData.bestScore = score;

        saveGame();
      }
    };

    // =========================================
    // AUTO SAVE EVERY 10 SEC
    // =========================================

    setInterval(() => {

      saveGame();

    }, 10000);

    // =========================================
    // SAVE ON TAB CLOSE
    // =========================================

    window.addEventListener(
      "beforeunload",
      () => {

        saveGame();

      }
    );

    // =========================================
    // LOAD SAVE ON START
    // =========================================

    loadSave();

    console.log(
      "Firebase save system loaded"
    );

  </script>

  <!-- GAME FILES -->

  <script src="vendors.bundle.js"></script>

  <script src="main.bundle.js"></script>

</body>

</html>
